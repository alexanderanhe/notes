<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Offline | Notes</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #09090b;
        color: #fafafa;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 24px;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        padding: 10px 16px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Reconnect to access your encrypted notes securely.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
